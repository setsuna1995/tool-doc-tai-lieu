[schedule]
time    = "08:30"
enabled = true

[output]
dir            = ""          # rỗng = tự dò OneDrive lần chạy đầu
subfolder      = "{year}-{month}"
font           = "Times New Roman"
font_size      = 13
include_images = true

[gemini]
# Ghim từ `med models` ngày 2026-09-14. Thứ tự = thứ tự ưu tiên dự phòng.
rank_models      = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash"]
translate_models = ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]

[gemini.limits]
flash      = { rpd = 20,  rpm = 5  }
flash_lite = { rpd = 500, rpm = 15 }

[ranking]
shortlist_size = 6
max_age_hours  = 48
prefilter_top  = 60
